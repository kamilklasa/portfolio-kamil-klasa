server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    add_header Cache-Control "no-cache";

    # Własny HTML każdego prerenderowanego adresu, bez przekierowania URL.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Pliki z hashem mogą być długo przechowywane przez przeglądarkę.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React pokazuje stronę błędu, a serwer zachowuje status HTTP 404.
    error_page 404 /__spa-fallback.html;
    location = /__spa-fallback.html {
        internal;
    }
}
